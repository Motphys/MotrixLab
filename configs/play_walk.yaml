defaults:
  - play_walk_schema
  - _self_
  # Console logging only; don't drop a <job>.log file in the working dir.
  - override hydra/job_logging: stdout

# Overrides the simulator name recorded in the run metadata for manager envs.
sim: null

# Fixed-command validation settings.
duration_seconds: 100.0
warmup_seconds: 2.0
eval_steps: null
forward_velocity: 0.5
lateral_velocity: 0.0
yaw_velocity: 0.0
# Set this to a registered environment name to test a policy outside its
# metadata training environment, for example ``go2-walk-rough``.
eval_env: null

# Footfall analysis output. If null, save under the selected run's
# ``walk_analysis`` directory.
analysis_dir: null
analysis_env_index: 0
metrics_path: null
no_render: false

hydra:
  output_subdir: null
  run:
    dir: .
  sweep:
    dir: .
    subdir: ${hydra.job.num}
  job:
    chdir: false
