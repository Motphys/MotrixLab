# @package _global_
# Task g1-walk-flat: motrix.fastsac shared training recipe.
defaults:
  - /algo_base@algo: motrix.fastsac
  - _self_
task:
  env: g1-walk-flat
  rllib: motrix
  algo: fastsac
num_envs: 2048
play_num_envs: 16
seed: 1
checkpoint:
  interval: 1000
algo:
  agent:
    # Holosoma-alpha parity (alpha_init 0.001, target_entropy_ratio 0.0).
    # UTD 4 instead of holosoma's 8: the utd16 sweep measured no tracking
    # gain from more updates, at half the learner cost.
    alpha_init: 0.001
    target_entropy_ratio: 0.0
    num_updates: 4
  trainer:
    num_learning_iterations: 30000
