# @package _global_
# MotrixSim manager-based SONIC G1 tracking with the SONIC FastSAC actor.
defaults:
  - /algo_base@algo: motrix.fastsac
  - /sonic_model@algo.sonic.model: release
  - _self_
task:
  env: g1-sonic
  rllib: motrix
  algo: fastsac
num_envs: 2048
play_num_envs: 16
seed: 1
checkpoint:
  interval: 1000
algo:
  sonic:
    enabled: true
    profile: release
  agent:
    num_updates: 4
    policy_frequency: 2
    gamma: 0.99
    tau: 0.05
    target_entropy_ratio: 0.5
    num_atoms: 501
  trainer:
    num_learning_iterations: 40000
    async_options:
      utd_mode: learner_bound
