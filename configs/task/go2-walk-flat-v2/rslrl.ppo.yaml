# @package _global_
# Task go2-walk-flat-v2: RSL-RL PPO fast flat-ground training recipe.
# 1024 environments, 2000 iterations, and 4 minibatches.
defaults:
  - /algo_base@algo: rslrl.ppo
  - _self_
task:
  env: go2-walk-flat-v2
  rllib: rslrl
  algo: ppo
  train_backend: null
num_envs: 1024
play_num_envs: 16
seed: 1
checkpoint:
  interval: 100
algo:
  max_iterations: 2000
  obs_groups:
    actor:
      - policy
    critic:
      - value
  actor:
    hidden_dims:
      - 512
      - 256
      - 128
    init_noise_std: 0.5
  critic:
    hidden_dims:
      - 512
      - 256
      - 128
  algorithm:
    num_mini_batches: 4
    desired_kl: 0.01
    entropy_coef: 0.001
