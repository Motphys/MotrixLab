[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "motrixlab"
version = "0.4.0b1"
description = "MotrixLab framework with built-in reinforcement learning and the MotrixSim backend."
authors = [{ name = "Motphys", email = "developers@motphys.com" }]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["reinforcement-learning", "robotics", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium==1.1.1",
    "hydra-core>=1.3,<1.4",
    "motrixsim==0.10.1",
    "numpy>=1.26",
    "omegaconf>=2.3,<2.4",
    "motrix-env-core==0.4.0b1",
    "motrix-deploy==0.4.0b1",
    "motrix-rl==0.4.0b1",
    "motrix-rl-builtin==0.4.0b1",
    "motrix-env-motrixsim==0.4.0b1",
]

[project.urls]
Homepage = "https://github.com/Motphys/MotrixLab"
Documentation = "https://motrixlab.readthedocs.io"
Repository = "https://github.com/Motphys/MotrixLab"
Issues = "https://github.com/Motphys/MotrixLab/issues"
Changelog = "https://github.com/Motphys/MotrixLab/releases"

[project.scripts]
mxlab = "motrixlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"motrixlab.configs" = ["*.yaml"]
