[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[project]
name = "motrix-env-mujoco"
version = "0.4.0b0"
description = "Compile-only MuJoCo scene backend for the motrix-env-core environment framework."
authors = [{ name = "Motphys", email = "developers@motphys.com" }]
requires-python = "==3.10.*"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "motrix-env-core==0.4.0b0",
    "mujoco==3.9.0",
    "numpy>=1.26",
]

[project.entry-points."motrix_env.sim_backends"]
mujoco = "motrix_env_mujoco.register:register"
