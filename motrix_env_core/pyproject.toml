[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[project]
name = "motrix-env-core"
version = "0.4.0"
description = "Backend-neutral framework APIs and runtime facilities for building reinforcement learning environments."
authors = [{ name = "Motphys", email = "developers@motphys.com" }]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "reinforcement-learning",
    "robotics",
    "simulation",
    "environment",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Heavy runtime deps (imageio for video recording) are optional extras so
# deployment-side installs
# (motrix-deploy and its backend plugins) only pull the lightweight config,
# registry and input layers of this package. gymnasium stays in the base
# dependencies because ``motrix_env_core.base`` (on the bare package import
# path) types observation/action spaces with it, and it is a small
# pure-Python distribution. torch backs the public frontend state contract
# (ArrayEnv/DirectEnv/ManagerEnv tensors); GPU-specific wheel indexes stay in
# the training-side packages. array-api-compat is used by the shared
# NumPy/Torch math helpers and the manager env namespace and is likewise small.
dependencies = [
    "array-api-compat==1.15.0",
    "gymnasium==1.1.1",
    "numpy>=1.26",
    "omegaconf>=2.3,<2.4",
    "torch>=2.7,<3",
    "typing-extensions>=4.1",
]

[project.optional-dependencies]
# Headless video recording via VideoRecorder.
video = [
    "imageio>=2.30",
    "imageio-ffmpeg>=0.5",
]
# Everything the training-side workspace needs from this package.
all = [
    "motrix-env-core[video]",
]

[project.urls]
Homepage = "https://github.com/Motphys/MotrixLab"
Repository = "https://github.com/Motphys/MotrixLab"
Issues = "https://github.com/Motphys/MotrixLab/issues"
Changelog = "https://github.com/Motphys/MotrixLab/releases"
