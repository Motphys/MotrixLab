[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[project]
name = "motrix-deploy"
version = "0.4.0b0"
description = "Framework-independent policy deployment runtime for MotrixLab."
authors = [{ name = "Motphys", email = "developers@motphys.com" }]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "reinforcement-learning",
    "robotics",
    "deployment",
    "onnx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# onnxruntime is a core dependency: deployed policies are ONNX artifacts, so
# every deployment runtime needs it for inference.
dependencies = [
    "hydra-core>=1.3,<1.4",
    "motrix-env-core==0.4.0b0",
    "numpy>=1.26",
    "onnxruntime==1.23.2",
    "pydantic===2.12.5",
]

[project.scripts]
motrix-deploy = "motrix_deploy.cli:main"

[project.urls]
Homepage = "https://github.com/Motphys/MotrixLab"
Repository = "https://github.com/Motphys/MotrixLab"
Issues = "https://github.com/Motphys/MotrixLab/issues"
Changelog = "https://github.com/Motphys/MotrixLab/releases"
