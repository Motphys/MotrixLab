<svg xmlns="http://www.w3.org/2000/svg" width="772" height="380" viewBox="0 0 772 380" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <text x="386.0" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">The simulation RL loop</text>
  <rect x="60" y="84" width="200" height="96" rx="9" fill="#eaf2fe" stroke="#4c8bf5" stroke-width="1.5"/>
  <text x="160.0" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">Policy</text>
  <text x="160.0" y="132" text-anchor="middle" font-size="10.5" fill="#1b4e91">network π(aₜ | oₜ)</text>
  <text x="160.0" y="148" text-anchor="middle" font-size="10.5" fill="#1b4e91">updated by the trainer</text>
  <rect x="500" y="84" width="212" height="96" rx="9" fill="#e8f7ed" stroke="#3fb950" stroke-width="1.5"/>
  <text x="606.0" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">Environment</text>
  <text x="606.0" y="132" text-anchor="middle" font-size="10.5" fill="#1e6b34">N parallel simulated envs</text>
  <text x="606.0" y="148" text-anchor="middle" font-size="10.5" fill="#1e6b34">physics step · reward · termination</text>
  <rect x="306" y="272" width="204" height="84" rx="9" fill="#f3eeff" stroke="#9775fa" stroke-width="1.5"/>
  <text x="408.0" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">Trainer / RL algorithm</text>
  <text x="408.0" y="320" text-anchor="middle" font-size="10.5" fill="#5f3dc4">collects transitions</text>
  <text x="408.0" y="336" text-anchor="middle" font-size="10.5" fill="#5f3dc4">updates policy parameters</text>
  <line x1="263" y1="114" x2="490" y2="114" stroke="#7a828c" stroke-width="1.6"/>
  <path d="M 490 110 L 497 114 L 490 118 z" fill="#7a828c"/>
  <text x="380.0" y="106" text-anchor="middle" font-size="11" fill="#57606a">action aₜ = π(oₜ)</text>
  <line x1="497" y1="166" x2="270" y2="166" stroke="#7a828c" stroke-width="1.6"/>
  <path d="M 270 162 L 263 166 L 270 170 z" fill="#7a828c"/>
  <text x="380.0" y="184" text-anchor="middle" font-size="11" fill="#57606a">observation oₜ</text>
  <line x1="606.0" y1="183" x2="606.0" y2="314.0" stroke="#7a828c" stroke-width="1.6"/>
  <line x1="606.0" y1="314.0" x2="518" y2="314.0" stroke="#7a828c" stroke-width="1.6"/>
  <path d="M 518 310.0 L 511 314.0 L 518 318.0 z" fill="#7a828c"/>
  <text x="598.0" y="251.0" text-anchor="end" font-size="11" fill="#57606a">reward rₜ · terminated / truncated</text>
  <text x="408.0" y="262" text-anchor="middle" font-size="10.5" fill="#5f3dc4">transitions (oₜ, aₜ, rₜ, done)</text>
  <line x1="306" y1="314.0" x2="160.0" y2="314.0" stroke="#7a828c" stroke-width="1.6"/>
  <line x1="160.0" y1="314.0" x2="160.0" y2="188" stroke="#7a828c" stroke-width="1.6"/>
  <path d="M 156.0 188 L 160.0 181 L 164.0 188 z" fill="#7a828c"/>
  <text x="152.0" y="251.0" text-anchor="end" font-size="11" fill="#57606a">update parameters</text>
  <rect x="24" y="355" width="14" height="14" rx="3.5" fill="#eaf2fe" stroke="#4c8bf5" stroke-width="1.3"/>
  <text x="45" y="366" font-size="11.5" fill="#57606a">Learning side (updated by training)</text>
  <rect x="284.5" y="355" width="14" height="14" rx="3.5" fill="#e8f7ed" stroke="#3fb950" stroke-width="1.3"/>
  <text x="305.5" y="366" font-size="11.5" fill="#57606a">Environment side</text>
  <rect x="429.1" y="355" width="14" height="14" rx="3.5" fill="#f3eeff" stroke="#9775fa" stroke-width="1.3"/>
  <text x="450.1" y="366" font-size="11.5" fill="#57606a">Training orchestration</text>
</svg>
