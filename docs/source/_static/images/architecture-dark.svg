<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="576" viewBox="0 0 1160 576" role="img" aria-label="MotrixLab architecture: define an environment once, train it with SKRL, RSL-RL or FastSAC on thousands of parallel MotrixSim environments running on NVIDIA CUDA or AMD ROCm GPUs, then deploy the same policy artifact to MuJoCo or Unitree hardware, with more hardware backends planned. Built-in environments cover basic control, locomotion, manipulation and whole-body tracking.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
    .stage   { font-size: 15px; font-weight: 700; letter-spacing: 2px; fill: #818cf8; }
    .title   { font-size: 15.5px; font-weight: 700; fill: #e6edf3; }
    .chip    { font-size: 15px; font-weight: 700; fill: #e6edf3; }
    .body    { font-size: 13.5px; fill: #e6edf3; }
    .sub     { font-size: 12px; fill: #9198a1; }
    .tag     { font-size: 11.5px; font-weight: 600; }
    .label   { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; fill: #9198a1; }
    .pill    { font-size: 11.5px; fill: #e6edf3; }
    .slogan  { font-size: 17px; font-weight: 800; fill: #ffffff; }
    .card    { fill: #161b22; stroke: #30363d; stroke-width: 1.2; }
    .flow    { fill: none; stroke: #818cf8; stroke-width: 1.8; marker-end: url(#arrow); }
    .flow-future { fill: none; stroke: #818cf8; stroke-width: 1.8; stroke-dasharray: 5 4; opacity: 0.7; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="1160" height="576" rx="18" fill="#0d1117"/>

  <!-- ============ slogan banners ============ -->
  <rect x="36" y="24" width="344" height="56" rx="16" fill="#6366f1"/>
  <text x="208" y="58" text-anchor="middle" class="sans slogan">One definition, every framework</text>

  <rect x="408" y="24" width="344" height="56" rx="16" fill="#6366f1"/>
  <text x="580" y="58" text-anchor="middle" class="sans slogan">Minutes to converge, not hours</text>

  <rect x="780" y="24" width="344" height="56" rx="16" fill="#6366f1"/>
  <text x="952" y="58" text-anchor="middle" class="sans slogan">From sim to real, one artifact</text>

  <!-- ============ stage headers ============ -->
  <text x="168" y="124" text-anchor="middle" class="sans stage">DEFINE ONCE</text>
  <text x="541" y="124" text-anchor="middle" class="sans stage">TRAIN FAST</text>
  <text x="1008" y="124" text-anchor="middle" class="sans stage">DEPLOY ANYWHERE</text>

  <!-- ============ stage 1: environment definition ============ -->
  <rect x="36" y="150" width="264" height="158" rx="12" class="card"/>
  <text x="168" y="180" text-anchor="middle" class="sans title">Environment definition</text>
  <line x1="60" y1="194" x2="276" y2="194" stroke="#30363d" stroke-width="1"/>
  <text x="64" y="218" class="sans body"><tspan fill="#818cf8">&#9656;</tspan><tspan dx="8">Observations &amp; actions</tspan></text>
  <text x="64" y="244" class="sans body"><tspan fill="#818cf8">&#9656;</tspan><tspan dx="8">Rewards &amp; terminations</tspan></text>
  <text x="64" y="270" class="sans body"><tspan fill="#818cf8">&#9656;</tspan><tspan dx="8">Scene, robot &amp; assets</tspan></text>
  <text x="64" y="296" class="sans body"><tspan fill="#818cf8">&#9656;</tspan><tspan dx="8">One shared config schema</tspan></text>

  <text x="168" y="336" text-anchor="middle" class="sans label">BUILT-IN LIBRARY</text>
  <rect x="36" y="344" width="128" height="26" rx="13" class="card"/>
  <text x="100" y="361" text-anchor="middle" class="sans" font-size="11.5" fill="#e6edf3">Basic control</text>
  <rect x="172" y="344" width="128" height="26" rx="13" class="card"/>
  <text x="236" y="361" text-anchor="middle" class="sans" font-size="11.5" fill="#e6edf3">Locomotion</text>
  <rect x="36" y="378" width="128" height="26" rx="13" class="card"/>
  <text x="100" y="395" text-anchor="middle" class="sans" font-size="11.5" fill="#e6edf3">Manipulation</text>
  <rect x="172" y="378" width="128" height="26" rx="13" class="card"/>
  <text x="236" y="395" text-anchor="middle" class="sans" font-size="11.5" fill="#e6edf3">Whole-body tracking</text>

  <!-- ============ stage 2: training frameworks ============ -->
  <rect x="386" y="150" width="310" height="56" rx="10" class="card"/>
  <text x="406" y="183" class="sans chip">SKRL</text>
  <rect x="593" y="166" width="97" height="24" rx="12" fill="#202542" stroke="#3b4468" stroke-width="1"/>
  <text x="641.5" y="182" text-anchor="middle" class="sans tag" fill="#a5b4fc">JAX &#183; PyTorch</text>

  <rect x="386" y="224" width="310" height="56" rx="10" class="card"/>
  <text x="406" y="257" class="sans chip">RSL-RL</text>
  <rect x="629" y="240" width="61" height="24" rx="12" fill="#202542" stroke="#3b4468" stroke-width="1"/>
  <text x="659.5" y="256" text-anchor="middle" class="sans tag" fill="#a5b4fc">PyTorch</text>

  <rect x="386" y="298" width="310" height="56" rx="10" class="card"/>
  <text x="406" y="331" class="sans chip">FastSAC</text>
  <rect x="618" y="314" width="72" height="24" rx="12" fill="#5450d6"/>
  <text x="654" y="330" text-anchor="middle" class="sans tag" fill="#fefefe">built-in &#9733;</text>

  <rect x="386" y="376" width="310" height="50" rx="10" fill="none" stroke="#30363d" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="541" y="398" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#e6edf3">Thousands of parallel environments</text>
  <text x="541" y="417" text-anchor="middle" class="sans" font-size="13" fill="#9198a1">on <tspan fill="#818cf8" font-weight="700">MotrixSim</tspan></text>

  <!-- ============ gpu backends ============ -->
  <text x="541" y="453" text-anchor="middle" class="sans label">GPU BACKENDS</text>
  <rect x="386" y="462" width="145" height="28" rx="14" class="card"/>
  <g transform="translate(405 468) scale(0.6667)" fill="#76b900"><path d="M8.948 8.798v-1.43a6.7 6.7 0 0 1 .424-.018c3.922-.124 6.493 3.374 6.493 3.374s-2.774 3.851-5.75 3.851c-.398 0-.787-.062-1.158-.185v-4.346c1.528.185 1.837.857 2.747 2.385l2.04-1.714s-1.492-1.952-4-1.952a6.016 6.016 0 0 0-.796.035m0-4.735v2.138l.424-.027c5.45-.185 9.01 4.47 9.01 4.47s-4.08 4.964-8.33 4.964c-.37 0-.733-.035-1.095-.097v1.325c.3.035.61.062.91.062 3.957 0 6.82-2.023 9.593-4.408.459.371 2.34 1.263 2.73 1.652-2.633 2.208-8.772 3.984-12.253 3.984-.335 0-.653-.018-.971-.053v1.864H24V4.063zm0 10.326v1.131c-3.657-.654-4.673-4.46-4.673-4.46s1.758-1.944 4.673-2.262v1.237H8.94c-1.528-.186-2.73 1.245-2.73 1.245s.68 2.412 2.739 3.11M2.456 10.9s2.164-3.197 6.5-3.533V6.201C4.153 6.59 0 10.653 0 10.653s2.35 6.802 8.948 7.42v-1.237c-4.84-.6-6.492-5.936-6.492-5.936z"/></g>
  <text x="428" y="480" class="sans pill">NVIDIA &#183; CUDA</text>
  <rect x="551" y="462" width="145" height="28" rx="14" class="card"/>
  <g transform="translate(540.5 448) scale(2.27)" fill="#e6edf3"><path d="M18.324 9.137l1.559 1.56h2.556v2.557L24 14.814V9.137zM19.881 11.01l-1.604 1.603v2.25h2.246l1.604-1.607h-2.246z"/></g>
  <text x="603" y="480" class="sans pill">AMD &#183; ROCm</text>

  <!-- ============ artifact pill ============ -->
  <rect x="736" y="220" width="132" height="64" rx="32" fill="#202542" stroke="#818cf8" stroke-width="1.4"/>
  <text x="802" y="248" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#a5b4fc">policy artifact</text>
  <text x="802" y="266" text-anchor="middle" class="mono" font-size="11" fill="#9198a1">.onnx / .pt</text>

  <!-- ============ stage 3: deployment targets ============ -->
  <rect x="892" y="164" width="232" height="52" rx="10" class="card"/>
  <text x="912" y="188" class="sans chip">MuJoCo</text>
  <text x="912" y="207" class="sans sub">simulation replay</text>
  <rect x="1054" y="178" width="50" height="24" rx="12" fill="#102a45" stroke="#4493f8" stroke-width="1"/>
  <text x="1079" y="194" text-anchor="middle" class="sans tag" font-size="11" fill="#4493f8">SIM</text>

  <rect x="892" y="228" width="232" height="52" rx="10" class="card"/>
  <text x="912" y="252" class="sans chip">Unitree</text>
  <text x="912" y="271" class="sans sub">real hardware &#183; DDS</text>
  <rect x="1054" y="242" width="50" height="24" rx="12" fill="#122d1f" stroke="#2ea043" stroke-width="1"/>
  <text x="1079" y="258" text-anchor="middle" class="sans tag" font-size="11" fill="#3fb950">REAL</text>

  <rect x="892" y="292" width="232" height="52" rx="10" fill="none" stroke="#30363d" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="1008" y="315" text-anchor="middle" class="sans" font-size="13.5" font-weight="700" fill="#9198a1">+ more hardware</text>
  <text x="1008" y="333" text-anchor="middle" class="sans sub" font-size="11.5">on the roadmap</text>

  <!-- ============ connectors ============ -->
  <path class="flow" d="M 300 229 C 338 229 348 178 386 178"/>
  <path class="flow" d="M 300 229 C 338 229 348 252 386 252"/>
  <path class="flow" d="M 300 229 C 338 229 348 326 386 326"/>
  <path class="flow" d="M 696 178 C 716 178 716 252 736 252"/>
  <path class="flow" d="M 696 252 C 712 252 720 252 736 252"/>
  <path class="flow" d="M 696 326 C 716 326 716 252 736 252"/>
  <path class="flow" d="M 868 252 C 880 252 880 190 892 190"/>
  <path class="flow" d="M 868 252 C 880 252 880 254 892 254"/>
  <path class="flow-future" d="M 868 252 C 880 252 880 318 892 318"/>

  <!-- ============ bottom CLI bar ============ -->
  <rect x="36" y="512" width="1088" height="40" rx="20" class="card"/>
  <text x="580" y="537" text-anchor="middle" class="sans" font-size="13"><tspan font-weight="700" fill="#e6edf3">One CLI, end to end:&#160;&#160;</tspan><tspan class="mono" font-size="12.5" fill="#818cf8">train</tspan><tspan fill="#9198a1">&#160; &#183; &#160;</tspan><tspan class="mono" font-size="12.5" fill="#818cf8">play</tspan><tspan fill="#9198a1">&#160; &#183; &#160;</tspan><tspan class="mono" font-size="12.5" fill="#818cf8">deploy</tspan></text>
</svg>
