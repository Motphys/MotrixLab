[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[project]
name = "motrix-deploy-mujoco"
version = "0.4.0b0"
description = "SceneCfg-backed MuJoCo plugin for the Motrix deployment runtime."
authors = [{ name = "Motphys", email = "developers@motphys.com" }]
requires-python = "==3.10.*"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "motrix-deploy==0.4.0b0",
    "motrix-env-mujoco==0.4.0b0",
    "hydra-core>=1.3",
    "numpy>=1.26",
]

[project.entry-points."motrix_deploy.backends"]
mujoco = "motrix_deploy_mujoco.plugin:create_runtime"
