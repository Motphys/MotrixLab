[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[project]
name = "motrix-rl"
version = "0.4.0b0"
description = "Reinforcement learning training framework with multi-backend unified training interface."
authors = [{ name = "Motphys", email = "developers@motphys.com" }]
requires-python = "==3.10.*"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "gymnasium==1.1.1",
    "python-abc>=0.2.0",
    "motrix-env-core",
    "motrix-env-motrixsim",
    "rich>=13",
    "hydra-core>=1.3,<1.4",
    "motrix-deploy",
    "numpy>=1.26",
    "omegaconf>=2.3,<2.4",
    "nvidia-ml-py>=13.610.43",
    # Default training backend; also required by scripts/view.py. Resolved
    # from the pytorch-cu128 index via the workspace root tool.uv.sources.
    "torch==2.7.0",
]

[project.optional-dependencies]
onnx = ["onnx==1.20.1", "onnxruntime==1.23.2"]
skrl-jax = [
    "skrl>=2.1,<2.2; sys_platform == 'linux'",
    "jax[cuda12]==0.4.34; sys_platform == 'linux'",
    "flax==0.10.4; sys_platform == 'linux'",
    "tensorflow==2.20.0; sys_platform == 'linux'",
]
skrl-torch = [
    "skrl>=2.1,<2.2",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "torchaudio==2.7.0",
]
rslrl = [
    "motrix-deploy[onnx]",
    "onnx==1.20.1",
    "rsl-rl-lib>=4.0,<5.0",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "torchaudio==2.7.0",
]
