[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[project]
name = "motrix-rl"
version = "0.4.0b1"
description = "Reinforcement learning training framework with multi-backend unified training interface."
authors = [{ name = "Motphys", email = "developers@motphys.com" }]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "reinforcement-learning",
    "robotics",
    "training",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "gymnasium==1.1.1",
    "motrix-env-core[numba,video]==0.4.0b1",
    "rich>=13",
    "hydra-core>=1.3,<1.4",
    "motrix-deploy==0.4.0b1",
    "numpy>=1.26",
    "omegaconf>=2.3,<2.4",
    "nvidia-ml-py>=13.610.43",
    # ONNX export of trained policies; onnxruntime (for the parity check and
    # deployment inference) comes in via motrix-deploy.
    "onnx==1.20.1",
    # Default training backend; GPU profiles below optionally pin its version
    # and, when consumed from source with uv, its wheel index.
    "torch>=2.7,<3",
]

[project.optional-dependencies]
cuda = [
    "torch==2.7.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchvision==0.22.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchaudio==2.7.0; sys_platform == 'linux' or sys_platform == 'win32'",
]
# ROCm wheels are available only for Linux x86_64.
rocm = [
    "amdsmi; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch==2.11.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "triton-rocm==3.6.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv]
conflicts = [[{ extra = "cuda" }, { extra = "rocm" }]]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm72"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
# Keep default installs on PyPI; only explicit GPU extras select these indexes.
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'", extra = "cuda" },
    { index = "pytorch-rocm72", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'", extra = "rocm" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'", extra = "cuda" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'", extra = "cuda" },
]
triton-rocm = [
    { index = "pytorch-rocm72", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'", extra = "rocm" },
]

[project.urls]
Homepage = "https://github.com/Motphys/MotrixLab"
Repository = "https://github.com/Motphys/MotrixLab"
Issues = "https://github.com/Motphys/MotrixLab/issues"
Changelog = "https://github.com/Motphys/MotrixLab/releases"
