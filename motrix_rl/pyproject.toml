[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[project]
name = "motrix-rl"
version = "0.4.0b0"
description = "Reinforcement learning training framework with multi-backend unified training interface."
authors = [{ name = "Motphys", email = "developers@motphys.com" }]
requires-python = "==3.10.*"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "gymnasium==1.1.1",
    "python-abc>=0.2.0",
    "motrix-env-core",
    "motrix-env-motrixsim",
    "rich>=13",
    "hydra-core>=1.3,<1.4",
    "motrix-deploy",
    "numpy>=1.26",
    "omegaconf>=2.3,<2.4",
    "nvidia-ml-py>=13.610.43",
    # ONNX export of trained policies; onnxruntime (for the parity check and
    # deployment inference) comes in via motrix-deploy.
    "onnx==1.20.1",
    # Default training backend; also required by scripts/view.py. The exact
    # version and wheel index are chosen by the workspace root `cuda`/`rocm`
    # extras (see the root pyproject.toml tool.uv.sources).
    "torch>=2.7,<3",
]

[project.optional-dependencies]
skrl-jax = [
    "skrl>=2.1,<2.2; sys_platform == 'linux'",
    "jax[cuda12]==0.4.34; sys_platform == 'linux'",
    "flax==0.10.4; sys_platform == 'linux'",
    "tensorflow==2.20.0; sys_platform == 'linux'",
]
skrl-torch = [
    "skrl>=2.1,<2.2",
    "torch>=2.7,<3",
]
rslrl = [
    "rsl-rl-lib>=4.0,<5.0",
    "torch>=2.7,<3",
]
