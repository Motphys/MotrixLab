[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[project]
name = "motrix-rl-appo"
version = "0.5.0"
description = "Torch APPO asynchronous actor-learner provider for MotrixLab."
authors = [{ name = "Motphys", email = "developers@motphys.com" }]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "motrix-env-core==0.5.0",
    "motrix-rl==0.5.0",
    "torch>=2.9,<3",
]
