defaults:
  - _unitree_schema
  - /unitree_control@control: g1
  - _self_

backend: unitree
robot: g1-29dof
transport:
  implementation: native_cpp
  network_interface: ???

operator:
  intents:
    request_fixstand:
      held: [LT]
      pressed: up
    request_walk:
      held: [RB]
      pressed: X
    request_wbt:
      held: [RB]
      pressed: Y
    request_passive:
      held: [LT]
      pressed: B
    request_emergency:
      pressed: select
  planar_velocity:
    linear_x_axis: ly
    linear_y_axis: lx
    yaw_axis: rx
    invert_linear_x: false
    invert_linear_y: true
    invert_yaw: true
    deadzone: 0.12
    range_scale: [0.25, 0.25, 0.25]
    deadman_button: null

control:
  startup_mode: state_machine
