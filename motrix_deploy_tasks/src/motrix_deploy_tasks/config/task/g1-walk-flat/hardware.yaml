# @package _global_
defaults:
  - /runtime@runtime: _unitree_schema
  - /unitree_robot@runtime.robot: g1-29dof
  - _self_

artifact: artifacts/g1-flat.deploy
duration_s: 30.0

runtime:
  backend: unitree
  transport: native_cpp
  network_interface: ???
  domain_id: 0
  lowcmd_topic: rt/lowcmd
  lowstate_topic: rt/lowstate
  connect_timeout_s: 5.0
  subscriber_queue_depth: 10
  validate_crc: true

  operator:
    intents:
      request_stand:
        held: [LT]
        pressed: up
      enable_policy:
        held: [RB]
        pressed: X
      enter_passive:
        held: [LT]
        pressed: B
      emergency_stop:
        pressed: select
    planar_velocity:
      linear_x_axis: ly
      linear_y_axis: lx
      yaw_axis: rx
      invert_linear_x: false
      invert_linear_y: true
      invert_yaw: true
      deadzone: 0.12
      range_scale: [0.25, 0.25, 0.25]
      deadman_button: null

  robot:
    mode_pr: 0
    expected_mode_machine: 5
    motor_mode: 1
    command_publish_period_s: 0.001
    command_timeout_s: 0.1
    default_transition_duration_s: 3.0
    damping_duration_s: 1.0
    damping_kd: 3.0
    wait_for_remote_buttons: true
    allow_lie_down: false
    override_policy_gains: false
    # FixStand gains are fixed in motrix_robots.g1_standing; artifact gains own the policy phase.
