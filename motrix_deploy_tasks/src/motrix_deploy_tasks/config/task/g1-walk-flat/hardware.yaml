# @package _global_
defaults:
  - /runtime@runtime: _unitree_schema
  - /unitree_control@runtime.control: g1
  - _self_

artifact: artifacts/g1-flat.deploy
duration_s: 30.0

runtime:
  backend: unitree
  robot: g1-29dof
  transport:
    implementation: native_cpp
    network_interface: ???

  operator:
    intents:
      request_stand:
        held: [LT]
        pressed: up
      enable_policy:
        held: [RB]
        pressed: X
      enter_passive:
        held: [LT]
        pressed: B
      emergency_stop:
        pressed: select
    planar_velocity:
      linear_x_axis: ly
      linear_y_axis: lx
      yaw_axis: rx
      invert_linear_x: false
      invert_linear_y: true
      invert_yaw: true
      deadzone: 0.12
      range_scale: [0.25, 0.25, 0.25]
      deadman_button: null

task_settings:
  preparation:
    default_transition_duration_s: 3.0
    wait_for_remote_buttons: true
    start_button: start
    enable_button: A
    # null selects the shared FixStand gains, not the policy tracking gains.
    kp: null
    kd: null
