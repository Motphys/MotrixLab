# @package _global_
# cyberdog2 flat sim spawns crouched, which enables the stand-up preparation lifecycle
# (R then P in the viewer), and requires the clipped crouch translation below.
defaults:
  - /runtime: sim
  - _self_

artifact: artifacts/cyberdog2-walk-flat.deploy

runtime:
  backend: mujoco
  sensor_bindings:
    base_angular_velocity: gyro
    base_linear_acceleration: accelerometer
    base_linear_velocity: global_linvel
  deploy_env_id: flat
  robot_id: cyberdog2
  robot_init_key_pose: defaults
  # Imported root starts at 0.445 m; place clipped crouch close to floor
  # without an initial penetration in the flat MuJoCo scene.
  robot_translation: [0.0, 0.0, -0.32]
  robot_rotation: [0.0, 0.0, 0.0, 1.0]
  physics:
    dt: 0.002
    solver_iterations: 100
