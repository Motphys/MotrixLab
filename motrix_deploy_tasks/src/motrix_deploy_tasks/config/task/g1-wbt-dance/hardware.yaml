# @package _global_
defaults:
  - /runtime@runtime: _unitree_schema
  - /unitree_robot@runtime.robot: g1-29dof
  - _self_

artifact: artifacts/g1-wbt-dance.deploy

runtime:
  backend: unitree
  transport: native_cpp
  network_interface: ???
  domain_id: 0
  lowcmd_topic: rt/lowcmd
  lowstate_topic: rt/lowstate
  connect_timeout_s: 5.0
  subscriber_queue_depth: 10
  validate_crc: true
  robot:
    # FixStand gains are fixed in motrix_robots.g1_standing; artifact gains own the policy phase.
    override_policy_gains: false
    mode_pr: 0
    expected_mode_machine: 5
    motor_mode: 1
    command_publish_period_s: 0.001
    command_timeout_s: 0.1
    default_transition_duration_s: 3.0
    damping_duration_s: 1.0
    damping_kd: 3.0
    wait_for_remote_buttons: true
    start_button: start
    enable_button: A
    emergency_stop_button: select
    allow_lie_down: false

# Exactly the clip playback budget: 999 frames x 0.02 s.
duration_s: 19.98
