[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[project]
name = "motrix-deploy-tasks"
version = "0.4.0"
description = "Concrete policy deployment tasks for MotrixLab."
authors = [{ name = "Motphys", email = "developers@motphys.com" }]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "motrix-deploy==0.4.0",
    "motrix-env-core==0.4.0",
    "motrix-robots==0.4.0",
    "hydra-core>=1.3,<1.4",
    "numpy>=1.26",
]

[project.entry-points."motrix_deploy.tasks"]
"go2_walk/v1" = "motrix_deploy_tasks.tasks.go2_walk:Go2WalkDeployTask"
"g1_wbt/v1" = "motrix_deploy_tasks.tasks.g1_wbt:G1WbtDeployTask"
"g1_walk/v1" = "motrix_deploy_tasks.tasks.g1_walk:G1WalkDeployTask"

[project.entry-points."motrix_deploy.envs"]
flat = "motrix_deploy_tasks.envs.flat:build_scene"
rough = "motrix_deploy_tasks.envs.rough:build_scene"

[project.entry-points."motrix_deploy.programs"]
g1-hot-swapping = "motrix_deploy_tasks.programs.g1_hot_swapping:create_program"

[tool.uv.build-backend]
module-name = ["motrix_deploy_tasks", "hydra_plugins"]
namespace = true
