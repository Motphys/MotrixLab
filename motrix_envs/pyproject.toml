[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[project]
name = "motrix-envs"
version = "0.4.0b0"
description = "Robot simulation environment library based on MotrixSim providing multi-task RL environments."
authors = [{ name = "Motphys", email = "developers@motphys.com" }]
requires-python = "==3.10.*"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "gymnasium==1.1.1",
    "motrix-env-core[numba,video]",
    "motrix-env-motrixsim",
    "motrix-robots",
    "numpy>=1.26",
    "omegaconf>=2.3,<2.4",
]

[project.optional-dependencies]
deploy = ["motrix-deploy"]
