volumes:
  motrixlab-data:
    name: motrixlab-data

services:
  motrixlab-training:
    image: ${MOTRIXLAB_IMAGE:-motphys/motrixlab:cuda}
    container_name: motrixlab-training
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - motrixlab-data:/workspace/runs
    working_dir: /workspace
    shm_size: 1g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - train
      - task=${MOTRIX_TASK:-cartpole/skrl.ppo}
      - num_envs=${MOTRIX_NUM_ENVS:-2048}
    restart: "no"

  motrixlab-tensorboard:
    image: ${MOTRIXLAB_IMAGE:-motphys/motrixlab:cuda}
    container_name: motrixlab-tensorboard
    ports:
      - "${MOTRIX_TENSORBOARD_PORT:-6006}:6006"
    volumes:
      - motrixlab-data:/workspace/runs:ro
    working_dir: /workspace
    entrypoint: /app/.venv/bin/tensorboard
    command:
      - --host
      - 0.0.0.0
      - --logdir
      - runs/${MOTRIX_ENV:-cartpole}
    restart: unless-stopped
