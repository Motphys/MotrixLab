[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[project]
name = "motrix-rl-builtin"
version = "0.5.0"
description = "MotrixLab built-in reinforcement learning algorithms."
authors = [{ name = "Motphys", email = "developers@motphys.com" }]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "motrix-rl==0.5.0",
    "motrix-rl-supermimic==0.5.0",
    "gymnasium==1.1.1",
    "numpy>=1.26",
    "torch>=2.9,<3",
    "motrix-bench==0.5.0",
]

[project.entry-points."motrix_rl.frameworks"]
builtin = "motrix_rl_builtin.plugin:register"

[project.entry-points."motrixlab.benchmarks"]
"fastsac.collector.step" = "motrix_rl_builtin.fastsac.benchmark:register"
