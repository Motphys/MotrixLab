[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[project]
name = "motrix-rl-rslrl"
version = "0.4.0b0"
description = "RSLRL plugin for MotrixLab reinforcement learning."
authors = [{ name = "Motphys", email = "developers@motphys.com" }]
requires-python = "==3.10.*"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "motrix-rl>=0.4.0b0",
    "torch>=2.7,<3",
    "rsl-rl-lib>=4.0,<5.0",
]

[project.entry-points."motrix_rl.frameworks"]
rslrl = "motrix_rl_rslrl.plugin:register"
