[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[project]
name = "motrix-rl-skrl"
version = "0.4.0b0"
description = "SKRL plugin for MotrixLab reinforcement learning."
authors = [{ name = "Motphys", email = "developers@motphys.com" }]
requires-python = "==3.10.*"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "motrix-rl>=0.4.0b0",
    "skrl>=2.1,<2.2",
    "torch>=2.7,<3",
]

[project.optional-dependencies]
jax = [
    "jax[cuda12]==0.4.34; sys_platform == 'linux'",
    "flax==0.10.4; sys_platform == 'linux'",
    "tensorflow==2.20.0; sys_platform == 'linux'",
]

[project.entry-points."motrix_rl.frameworks"]
skrl = "motrix_rl_skrl.plugin:register"
