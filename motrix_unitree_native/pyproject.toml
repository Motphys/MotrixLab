[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13", "numpy>=1.26"]
build-backend = "scikit_build_core.build"

[project]
name = "motrix-unitree-native"
version = "0.4.0"
description = "Native Unitree SDK2 DDS transport for Motrix deployment"
requires-python = ">=3.10,<3.14"
dependencies = ["numpy>=1.26"]

[tool.scikit-build]
wheel.packages = ["python/motrix_unitree_native"]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
