name: Build and Push Docker Images

on:
  workflow_dispatch:

env:
  DOCKER_IMAGE: motphys/motrixlab
  DOCKERFILE: docker/Dockerfile

jobs:
  build-and-push:
    # Never publish images from a contributor fork.
    if: github.repository == 'Motphys/MotrixLab'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: train-cuda
            suffix: cuda
            default: "true"
          - target: train-cuda-jax
            suffix: cuda-jax
            default: "false"
          - target: train-rocm
            suffix: rocm
            default: "false"
          - target: deploy
            suffix: deploy
            default: "false"

    steps:
      - name: Free up disk space
        run: |
          echo "Removing hosted toolcache..."
          sudo rm -rf /opt/hostedtoolcache || true

          echo "Removing .NET..."
          sudo rm -rf /usr/share/dotnet || true

          echo "Removing Android SDK..."
          sudo rm -rf /usr/local/lib/android || true

          echo "Removing GHC / Haskell..."
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true

          echo "Docker prune (just in case runner had leftovers)..."
          sudo docker container prune -f || true
          sudo docker image prune -af || true
          sudo docker volume prune -f || true

          echo "################################"
          echo "Disk usage AFTER cleanup:"
          echo "################################"
          df -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify release tag is on stable
        run: |
          git fetch origin stable --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/stable"

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/' | tr -d '" ')
          MAJOR_MINOR="${VERSION%%.*}.${VERSION#*.}"
          MAJOR_MINOR="${MAJOR_MINOR%.*}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"
          echo "Extracted version: ${VERSION}"
          echo "Extracted major.minor version: ${MAJOR_MINOR}"

      - name: Prepare image tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MAJOR_MINOR: ${{ steps.version.outputs.major_minor }}
          SUFFIX: ${{ matrix.suffix }}
          DEFAULT: ${{ matrix.default }}
        run: |
          tags="${DOCKER_IMAGE}:${VERSION}-${SUFFIX}"
          tags="${tags}"$'\n'"${DOCKER_IMAGE}:${MAJOR_MINOR}-${SUFFIX}"
          tags="${tags}"$'\n'"${DOCKER_IMAGE}:${SUFFIX}"
          if [[ "$DEFAULT" == "true" ]]; then
            tags="${tags}"$'\n'"${DOCKER_IMAGE}:${VERSION}"
            tags="${tags}"$'\n'"${DOCKER_IMAGE}:${MAJOR_MINOR}"
            tags="${tags}"$'\n'"${DOCKER_IMAGE}:latest"
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            MOTRIXLAB_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=motrixlab-${{ matrix.target }}
          cache-to: type=gha,scope=motrixlab-${{ matrix.target }},mode=min
          provenance: false
